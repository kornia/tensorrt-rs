name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting gate: pure parse, no TensorRT/CUDA needed.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Hosted x86 runner: no TensorRT/CUDA — kornia-tensorrt-sys runs in stub mode
  # (TRT_STUB=1: committed pregenerated bindings, no native compile/link), and
  # kornia-tensorrt loads libcuda dynamically, so it builds and tests here too.
  check:
    runs-on: ubuntu-latest
    env:
      TRT_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (stub)
        run: cargo check --workspace --all-targets
      - name: cargo clippy (stub)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (stub, builder feature)
        run: cargo clippy --workspace --all-targets --features kornia-tensorrt-sys/builder,kornia-tensorrt/builder -- -D warnings
      # Stub builds must link too (crates/tensorrt-sys/src/stub_symbols.rs), so
      # downstream GPU-free tests can run on hosted runners.
      - name: cargo test (stub)
        run: cargo test --workspace
      - name: cargo test (stub, builder feature)
        run: cargo test --workspace --features kornia-tensorrt/builder
      - name: cargo doc (stub)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo doc (stub, builder feature)
        run: cargo doc --workspace --no-deps --features kornia-tensorrt/builder
        env:
          RUSTDOCFLAGS: -D warnings

  # Self-hosted Jetson runner: real TensorRT + CUDA.
  # Register a runner on the Orin with labels [self-hosted, jetson], then
  # remove the `if: false` guard.
  jetson:
    if: false  # enable once a self-hosted Jetson runner is registered
    runs-on: [self-hosted, jetson]
    env:
      # JetPack leaves nvcc off PATH, so without this cudarc silently falls back
      # to its latest (CUDA 13.x) bindings instead of the device's 12.6.
      CUDARC_CUDA_VERSION: "12060"
    steps:
      - uses: actions/checkout@v4
      - name: Build (real TensorRT)
        run: cargo build --release -j2
      - name: Build (real TensorRT, builder feature)
        run: cargo build --release -j2 --features kornia-tensorrt/builder
